<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mathe-Schreck rendert LaTeX-Code direkt im Browser.">
  <title>Mathe-Schreck · LaTeX-Renderer</title>
  <style>
    :root { color-scheme: dark; --bg:#030405; --panel:#171a1e; --field:#0b0d0f; --line:#30363d; --text:#edf1f4; --muted:#9ca6b0; --heading:#d19a74; --warn:#edbd68; --error:#ff8176; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header, main, footer { width:min(1180px, calc(100% - 2rem)); margin-inline:auto; }
    header { padding:2rem 0 1rem; }
    h1 { margin:0; color:var(--heading); font-size:clamp(2rem,6vw,3.5rem); letter-spacing:.02em; }
    header p { margin:.3rem 0 0; color:var(--muted); }
    main { display:grid; grid-template-columns:minmax(300px,1fr) minmax(300px,1fr); gap:1rem; align-items:start; }
    .panel, #sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; }
    label { display:block; margin:.55rem 0 .25rem; font-weight:650; }
    input, textarea, select, button { font:inherit; }
    input[type=text], textarea, select { width:100%; padding:.65rem; border:1px solid #3b2a20; border-radius:7px; background:var(--field); color:var(--text); }
    textarea { min-height:300px; resize:vertical; font: .95rem/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
    :is(input,textarea,select,button):focus-visible { outline:2px solid #7e8790; outline-offset:2px; }
    .controls { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-top:.8rem; }
    button { padding:.6rem .85rem; border:1px solid var(--line); border-radius:7px; background:#22272d; color:var(--text); cursor:pointer; }
    button:hover { border-color:#7e8790; background:#2b3239; }
    button.primary { background:#30363d; border-color:#59636d; font-weight:700; }
    .check { display:flex; align-items:center; gap:.4rem; margin:0; font-weight:400; color:var(--muted); }
    .check input { accent-color:#7e8790; }
    .inline { width:auto; }
    #status { min-height:1.5em; margin:.7rem 0 0; color:var(--muted); }
    #status.warn { color:var(--warn); } #status.error { color:var(--error); }
    #sheet { min-height:300px; overflow:auto; }
    #sheet-title { display:none; margin:0 0 1rem; padding-bottom:.5rem; border-bottom:1px solid #30363d; }
    #preview { color:#f4f6f8; }
    .inline-plot { width:100%; margin:1.4rem 0; padding:1rem 0; border-top:1px solid #30363d; border-bottom:1px solid #30363d; }
    .plot-card { width:100%; }
    .plot-title { margin:0 0 .4rem; color:var(--text); font-size:1rem; }
    .plot { width:100%; min-height:360px; }
    .hint { color:var(--muted); font-size:.86rem; margin:.5rem 0 0; }
    footer { padding:1rem 0 2rem; color:var(--muted); font-size:.85rem; }
    code { color:#c6cdd3; }
    @media (max-width:820px) { main { grid-template-columns:1fr; } textarea { min-height:240px; } }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff; color:#000; }
      header, main, footer { width:auto; }
      main { display:block; margin:0; }
      #sheet { border:0; padding:0; color:#000; background:#fff; }
      #preview, #sheet-title { color:#000 !important; }
      #sheet-title { border-color:#000; }
      @page { margin:18mm; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <h1>Mathe-Schreck</h1>
    <p>LaTeX aus einer KI einfügen, prüfen und als PDF speichern.</p>
  </header>

  <main>
    <section class="panel no-print" aria-label="Eingabe">
      <label for="title">Überschrift</label>
      <input id="title" type="text" placeholder="z. B. Quadratische Gleichungen · Name · Klasse">

      <label for="code">LaTeX-Code</label>
      <textarea id="code" spellcheck="false" placeholder="LaTeX hier einfügen. Markdown-Zeilen wie ```latex werden entfernt."></textarea>

      <div class="controls">
        <label class="check"><input id="pure" type="checkbox" checked> Reine Formel</label>
        <label class="check" for="size">Größe
          <select id="size" class="inline"><option value="1">normal</option><option value="1.3">groß</option><option value="1.6">sehr groß</option></select>
        </label>
      </div>
      <div class="controls">
        <button id="print" class="primary">Als PDF speichern</button>
        <button id="copy">Link kopieren</button>
        <button id="clear">Leeren</button>
      <select id="examples" class="inline" aria-label="Beispiel laden">
          <option value="">Beispiel laden …</option><option value="pq">p-q-Formel</option><option value="integral">Integral</option><option value="steps">Umformung</option><option value="text">Text mit Formeln</option><option value="matrix">Matrix</option><option value="graph2d">2D-Parabel</option><option value="graph3d">3D-Kugel</option>
        </select>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="sheet" aria-label="Vorschau">
      <h2 id="sheet-title"></h2>
      <div id="preview"></div>
    </section>
  </main>

  <footer class="no-print">Die Eingabe bleibt im Browser. Es gibt keinen Upload und kein Benutzerkonto. MathJax rendert Formeln; Plotly erzeugt 2D-/3D-Grafiken direkt im Browser.</footer>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const code = $('code'), title = $('title'), pure = $('pure'), size = $('size');
      const preview = $('preview'), sheetTitle = $('sheet-title'), status = $('status');
      const examples = {
        pq: String.raw`x_{1,2}=-\frac{p}{2}\pm\sqrt{\left(\frac{p}{2}\right)^2-q}`,
        integral: String.raw`\int_0^2 (x^2+1)\,dx=\left[\frac{x^3}{3}+x\right]_0^2=\frac{14}{3}`,
        steps: String.raw`\begin{align*}3(x-4)+7&=2x-1\\3x-5&=2x-1\\x&=4\end{align*}`,
        text: String.raw`Gegeben ist die Funktion $f(x)=x^3-3x$.

Die Ableitung lautet $f'(x)=3x^2-3$.

\$3x^2-3=0\quad\Rightarrow\quad x_{1,2}=\pm1$`,
        matrix: String.raw`A=\begin{pmatrix}1&2&0\\-1&3&4\\2&0&1\end{pmatrix},\qquad
\det(A)=9`,
        graph2d: String.raw`\begin{tikzpicture}
\begin{axis}[axis lines=middle, xlabel={$x$}, ylabel={$f(x)$}, grid=major]
\addplot[blue, domain=-3:3, samples=200]{x^2-2*x-3};
\addplot[red, domain=-3:3, samples=200]{2*x-1};
\end{axis}
\end{tikzpicture}`,
        graph3d: String.raw`\documentclass[border=10pt]{standalone}
\usepackage{pgfplots}
\pgfplotsset{compat=1.18}
\begin{document}
\begin{tikzpicture}
\begin{axis}[
  view={60}{20}, axis lines=center,
  xmin=-2.5, xmax=2.5, ymin=-2.5, ymax=2.5,
  zmin=-2.5, zmax=2.5, xlabel={$x$}, ylabel={$y$}, zlabel={$z$},
  ticks=none, grid=none, clip=false]
  \addplot3[surf, shader=flat, domain=-2:2, y domain=-2:2] {x};
  \addplot3[surf, shader=flat, domain=-2:2, y domain=-2:2] {y};
  \addplot3[very thick, domain=-2:2] ({x},{x},{x});
  \node at (axis cs: 1.6,-1.6,1.6) {$E_1$};
  \node at (axis cs: -1.6,1.6,1.6) {$E_2$};
  \node at (axis cs: 2.1,2.1,2.1) {$g$};
\end{axis}
\end{tikzpicture}
\end{document}`
      };

      window.MathJax = { tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']], processEscapes:true }, svg:{fontCache:'local'}, options:{enableMenu:false}, startup:{typeset:false} };

      const clean = value => value.replace(/\r\n/g,'\n').replace(/^\s*```(?:latex|tex)?\s*$/gim,'').trim();
      const math = (value, isPure) => {
        if (!isPure || /^\s*(\$\$|\\\[|\\begin\{)/.test(value)) return value;
        return `\\[${value}\\]`;
      };
      const save = () => { try { localStorage.setItem('mathe-schreck', JSON.stringify({c:code.value,t:title.value,p:pure.checked,s:size.value})); } catch (_) {} };
      const setStatus = (message, kind='') => { status.textContent = message; status.className = kind; };

      const number = value => Number.parseFloat(value);
      const expr = (source, variables) => {
        const safe = source.replace(/\\left|\\right/g,'').replace(/\\sqrt\s*\{/g,'sqrt(').replace(/\}/g,')').replace(/\^/g,'**').replace(/\bpi\b/g,'PI');
        if (!/^[0-9a-zA-Z_+*%().,\-\/ \t**]+$/.test(safe) || /(?:constructor|window|document|eval|function)/i.test(safe)) throw new Error('unbekannte Plot-Funktion');
        const names = variables.join(',');
        const body = `"use strict"; const {sqrt,sin,cos,tan,abs,exp,log,max,min,PI}=Math; return (${safe});`;
        return Function(names, body);
      };
      const range = (options, name, fallback) => {
        const match = options.match(new RegExp(`${name}\\s*=\\s*([-+]?\\d*\\.?\\d+)\\s*:\\s*([-+]?\\d*\\.?\\d+)`));
        return match ? [number(match[1]), number(match[2])] : fallback;
      };
      const bound = (options, name, fallback) => {
        const match = options.match(new RegExp(`${name}\\s*=\\s*([-+]?\\d*\\.?\\d+)`));
        return match ? number(match[1]) : fallback;
      };
      const axisOptions = block => block.match(/\[([\s\S]*?)\]/)?.[1] || '';
      function parsePlots(source) {
        const sourceWithoutComments = source.replace(/%[^\n]*/g, '');
        const blocks = [...sourceWithoutComments.matchAll(/\\begin\{tikzpicture\}([\s\S]*?)\\end\{tikzpicture\}/g)].map(m => m[1]);
        return blocks.flatMap(block => [...block.matchAll(/\\begin\{axis\}([\s\S]*?)\\end\{axis\}/g)].map(axisMatch => {
          const body = axisMatch[1], options = axisOptions(body), plots = [];
          const plotRe = /\\addplot(3)?(?:\[([\s\S]*?)\])?\s*(?:\{([\s\S]*?)\}|\(\s*\{([^}]*)\}\s*,\s*\{([^}]*)\}\s*,\s*\{([^}]*)\}\s*\))\s*;/g;
          for (const match of body.matchAll(plotRe)) {
            plots.push({is3d:Boolean(match[1]), options:match[2] || '', formula:match[3]?.trim() || '', parametric:match[4] ? [match[4],match[5],match[6]] : null});
          }
          const labels = [...body.matchAll(/\\node\s+at\s*\(axis cs:\s*([^,]+),\s*([^,]+),\s*([^\)]+)\)[^$]*\$([^$]+)\$/g)].map(m => ({x:number(m[1]), y:number(m[2]), z:number(m[3]), text:m[4]}));
          return {options, plots, labels};
        }));
      }
      function renderPlotGroup(group, target, index) {
        if (!window.Plotly) return;
          const is3d = group.plots.some(item => item.is3d);
          const heading = document.createElement('h3'); heading.className='plot-title'; heading.textContent = is3d ? `3D-Grafik ${index + 1}` : `2D-Grafik ${index + 1}`;
          target.append(heading);
          const chart = document.createElement('div'); chart.className='plot'; target.append(chart);
          try {
            if (is3d) {
              const xr=[bound(group.options,'xmin',-2.5),bound(group.options,'xmax',2.5)], yr=[bound(group.options,'ymin',-2.5),bound(group.options,'ymax',2.5)], zr=[bound(group.options,'zmin',-2.5),bound(group.options,'zmax',2.5)];
              const traces=[], steps=35, xs=Array.from({length:steps},(_,i)=>xr[0]+(xr[1]-xr[0])*i/(steps-1)), ys=Array.from({length:steps},(_,i)=>yr[0]+(yr[1]-yr[0])*i/(steps-1));
              group.plots.filter(item=>item.is3d).forEach(item => {
                if (item.parametric) {
                  const t=Array.from({length:200},(_,i)=>xr[0]+(xr[1]-xr[0])*i/199), fs=item.parametric.map(part=>expr(part,['x']));
                  traces.push({x:t.map(v=>fs[0](v)),y:t.map(v=>fs[1](v)),z:t.map(v=>fs[2](v)),type:'scatter3d',mode:'lines',line:{width:6,color:'#d19a74'}});
                } else {
                  const f=expr(item.formula,['x','y']), z=ys.map(y=>xs.map(x=>{try{return f(x,y)}catch(_){return NaN}}));
                  traces.push({x:xs,y:ys,z,type:'surface',colorscale:traces.length%2?'Reds':'Blues',opacity:.55,showscale:false,connectgaps:false});
                }
              });
              if (group.labels.length) traces.push({x:group.labels.map(l=>l.x),y:group.labels.map(l=>l.y),z:group.labels.map(l=>l.z),type:'scatter3d',mode:'text',text:group.labels.map(l=>l.text),textfont:{color:'#edf1f4',size:14}});
              Plotly.newPlot(chart,traces,{paper_bgcolor:'#171a1e',plot_bgcolor:'#171a1e',font:{color:'#edf1f4'},margin:{l:0,r:0,t:10,b:0},scene:{xaxis:{range:xr,gridcolor:'#3b424a'},yaxis:{range:yr,gridcolor:'#3b424a'},zaxis:{range:zr,gridcolor:'#3b424a'}}},{responsive:true,displaylogo:false});
            } else {
              const colors=['#d19a74','#7fa8d1','#a8c98b','#c88ac7'];
              const traces=group.plots.filter(item=>!item.is3d).map((item,index)=>{ const xr=range(item.options,'domain',[-5,5]), f=expr(item.formula,['x']); const xs=Array.from({length:250},(_,i)=>xr[0]+(xr[1]-xr[0])*i/249); return {x:xs,y:xs.map(x=>{try{return f(x)}catch(_){return NaN}}),mode:'lines',line:{color:colors[index%colors.length],width:3}}; });
              Plotly.newPlot(chart,traces,{paper_bgcolor:'#171a1e',plot_bgcolor:'#171a1e',font:{color:'#edf1f4'},margin:{l:48,r:18,t:10,b:42},xaxis:{gridcolor:'#3b424d',zerolinecolor:'#7e8790'},yaxis:{gridcolor:'#3b424d',zerolinecolor:'#7e8790'}},{responsive:true,displaylogo:false});
            }
          } catch (error) { chart.textContent=`Grafik konnte nicht gelesen werden: ${error.message}`; chart.className='hint'; }
      }
      function cleanTextSegment(value) {
        return value.replace(/%[^\n]*/g, '')
          .replace(/\\documentclass(?:\[[^\]]*\])?\{[^}]*\}/g, '')
          .replace(/\\usepackage(?:\[[^\]]*\])?\{[^}]*\}/g, '')
          .replace(/\\pgfplotsset\{[^}]*\}/g, '')
          .replace(/\\begin\{(?:document|tikzpicture)\}|\\end\{(?:document|tikzpicture)\}/g, '')
          .replace(/\\begin\{axis\}[\s\S]*?\\end\{axis\}/g, '')
          .trim();
      }
      function renderInline(source) {
        preview.replaceChildren();
        const graphPattern = /\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}/g;
        const blocks = [...source.matchAll(graphPattern)];
        const groups = parsePlots(source);
        let cursor = 0;
        blocks.forEach((block, index) => {
          const before = cleanTextSegment(source.slice(cursor, block.index));
          if (before) { const text = document.createElement('div'); text.className='text-segment'; text.textContent=math(before,pure.checked); preview.append(text); }
          if (groups[index]?.plots.length) { const target=document.createElement('div'); target.className='inline-plot'; preview.append(target); renderPlotGroup(groups[index],target,index); }
          cursor = block.index + block[0].length;
        });
        const after = cleanTextSegment(source.slice(cursor));
        if (after) { const text=document.createElement('div'); text.className='text-segment'; text.textContent=math(after,pure.checked); preview.append(text); }
      }

      async function render() {
        const raw = clean(code.value);
        sheetTitle.textContent = title.value.trim();
        sheetTitle.style.display = sheetTitle.textContent ? 'block' : 'none';
        preview.style.fontSize = `${size.value}rem`;
        preview.style.whiteSpace = pure.checked ? 'normal' : 'pre-wrap';
        renderInline(raw);
        setStatus(''); save();
        if (!raw || !window.MathJax?.typesetPromise) return;
        try {
          MathJax.typesetClear([preview]);
          await MathJax.typesetPromise([preview]);
          const error = preview.querySelector('mjx-merror');
          if (error) setStatus('LaTeX-Fehler: Syntax bitte prüfen.', 'error');
        } catch (error) { setStatus(`Rendern fehlgeschlagen: ${error.message}`, 'error'); }
      }

      let timer;
      const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 250); };
      [code,title].forEach(el => el.addEventListener('input', schedule));
      [pure,size].forEach(el => el.addEventListener('change', render));
      $('print').addEventListener('click', async () => { await render(); window.print(); });
      $('clear').addEventListener('click', () => { code.value=''; title.value=''; history.replaceState(null,'',location.pathname); render(); code.focus(); });
      $('copy').addEventListener('click', async () => {
        const params = new URLSearchParams({c:code.value,p:pure.checked?'1':'0'});
        history.replaceState(null,'',`${location.pathname}#${params}`);
        try { await navigator.clipboard.writeText(location.href); setStatus('Link kopiert. Der LaTeX-Code steckt in der URL.', 'warn'); }
        catch (_) { setStatus('Der Link steht in der Adresszeile und kann dort kopiert werden.', 'warn'); }
      });
      $('examples').addEventListener('change', event => { if (!event.target.value) return; code.value=examples[event.target.value]; pure.checked=!['text','graph2d','graph3d'].includes(event.target.value); event.target.value=''; render(); });
      document.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); render(); } });

      (() => {
        const hash = new URLSearchParams(location.hash.slice(1));
        if (hash.has('c')) { code.value=hash.get('c'); pure.checked=hash.get('p') !== '0'; }
        else { try { const data=JSON.parse(localStorage.getItem('mathe-schreck') || '{}'); code.value=data.c || ''; title.value=data.t || ''; if (typeof data.p === 'boolean') pure.checked=data.p; if (data.s) size.value=data.s; } catch (_) {} }
        render();
        const script=document.createElement('script'); script.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js'; script.async=true; script.onload=render; script.onerror=() => setStatus('MathJax konnte nicht geladen werden. Internetverbindung prüfen.', 'error'); document.head.appendChild(script);
        const plotScript=document.createElement('script'); plotScript.src='https://cdn.plot.ly/plotly-2.35.2.min.js'; plotScript.async=true; plotScript.onload=render; plotScript.onerror=() => setStatus('Plotly konnte nicht geladen werden. 2D-/3D-Grafiken sind offline nicht verfügbar.', 'warn'); document.head.appendChild(plotScript);
      })();
    })();
  </script>
</body>
</html>
