<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mathe-Schreck rendert LaTeX-Code direkt im Browser.">
  <title>Mathe-Schreck · LaTeX-Renderer</title>
  <style>
    :root { color-scheme: dark; --bg:#090807; --panel:#15100d; --field:#0d0a08; --line:#684936; --text:#f2e8df; --muted:#b49f8e; --accent:#9b6846; --bright:#d6a37d; --warn:#edbd68; --error:#ff8176; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header, main, footer { width:min(1180px, calc(100% - 2rem)); margin-inline:auto; }
    header { padding:2rem 0 1rem; }
    h1 { margin:0; color:var(--bright); font-size:clamp(2rem,6vw,3.5rem); letter-spacing:.02em; }
    header p { margin:.3rem 0 0; color:var(--muted); }
    main { display:grid; grid-template-columns:minmax(300px,1fr) minmax(300px,1fr); gap:1rem; align-items:start; }
    .panel, #sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; }
    label { display:block; margin:.55rem 0 .25rem; font-weight:650; }
    input, textarea, select, button { font:inherit; }
    input[type=text], textarea, select { width:100%; padding:.65rem; border:1px solid #3b2a20; border-radius:7px; background:var(--field); color:var(--text); }
    textarea { min-height:300px; resize:vertical; font: .95rem/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
    :is(input,textarea,select,button):focus-visible { outline:2px solid var(--bright); outline-offset:2px; }
    .controls { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-top:.8rem; }
    button { padding:.6rem .85rem; border:1px solid var(--line); border-radius:7px; background:#211711; color:var(--text); cursor:pointer; }
    button:hover { border-color:var(--bright); background:#302016; }
    button.primary { background:var(--accent); border-color:var(--accent); font-weight:700; }
    .check { display:flex; align-items:center; gap:.4rem; margin:0; font-weight:400; color:var(--muted); }
    .check input { accent-color:var(--bright); }
    .inline { width:auto; }
    #status { min-height:1.5em; margin:.7rem 0 0; color:var(--muted); }
    #status.warn { color:var(--warn); } #status.error { color:var(--error); }
    #sheet { min-height:300px; overflow:auto; }
    #sheet-title { display:none; margin:0 0 1rem; padding-bottom:.5rem; border-bottom:1px solid #3b2a20; }
    #preview { color:#fff8f1; }
    footer { padding:1rem 0 2rem; color:var(--muted); font-size:.85rem; }
    code { color:var(--bright); }
    @media (max-width:820px) { main { grid-template-columns:1fr; } textarea { min-height:240px; } }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff; color:#000; }
      header, main, footer { width:auto; }
      main { display:block; margin:0; }
      #sheet { border:0; padding:0; color:#000; background:#fff; }
      #preview, #sheet-title { color:#000 !important; }
      #sheet-title { border-color:#000; }
      @page { margin:18mm; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <h1>Mathe-Schreck</h1>
    <p>LaTeX aus einer KI einfügen, prüfen und als PDF speichern.</p>
  </header>

  <main>
    <section class="panel no-print" aria-label="Eingabe">
      <label for="title">Überschrift</label>
      <input id="title" type="text" placeholder="z. B. Quadratische Gleichungen · Name · Klasse">

      <label for="code">LaTeX-Code</label>
      <textarea id="code" spellcheck="false" placeholder="LaTeX hier einfügen. Markdown-Zeilen wie ```latex werden entfernt."></textarea>

      <div class="controls">
        <label class="check"><input id="pure" type="checkbox" checked> Reine Formel</label>
        <label class="check" for="size">Größe
          <select id="size" class="inline"><option value="1">normal</option><option value="1.3">groß</option><option value="1.6">sehr groß</option></select>
        </label>
      </div>
      <div class="controls">
        <button id="print" class="primary">Als PDF speichern</button>
        <button id="copy">Link kopieren</button>
        <button id="clear">Leeren</button>
        <select id="examples" class="inline" aria-label="Beispiel laden">
          <option value="">Beispiel laden …</option><option value="pq">p-q-Formel</option><option value="integral">Integral</option><option value="steps">Umformung</option><option value="text">Text mit Formeln</option>
        </select>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="sheet" aria-label="Vorschau">
      <h2 id="sheet-title"></h2>
      <div id="preview"></div>
    </section>
  </main>

  <footer class="no-print">Die Eingabe bleibt im Browser. Es gibt keinen Upload und kein Benutzerkonto. MathJax wird nur zum Rendern mathematischer Formeln geladen.</footer>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const code = $('code'), title = $('title'), pure = $('pure'), size = $('size');
      const preview = $('preview'), sheetTitle = $('sheet-title'), status = $('status');
      const examples = {
        pq: String.raw`x_{1,2}=-\frac{p}{2}\pm\sqrt{\left(\frac{p}{2}\right)^2-q}`,
        integral: String.raw`\int_0^2 (x^2+1)\,dx=\left[\frac{x^3}{3}+x\right]_0^2=\frac{14}{3}`,
        steps: String.raw`\begin{align*}3(x-4)+7&=2x-1\\3x-5&=2x-1\\x&=4\end{align*}`,
        text: String.raw`Gegeben ist die Funktion $f(x)=x^3-3x$.

Die Ableitung lautet $f'(x)=3x^2-3$.

$3x^2-3=0\quad\Rightarrow\quad x_{1,2}=\pm1$`
      };

      window.MathJax = { tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']], processEscapes:true }, svg:{fontCache:'local'}, options:{enableMenu:false}, startup:{typeset:false} };

      const clean = value => value.replace(/\r\n/g,'\n').replace(/^\s*```(?:latex|tex)?\s*$/gim,'').trim();
      const math = (value, isPure) => {
        if (!isPure || /^\s*(\$\$|\\\[|\\begin\{)/.test(value)) return value;
        return `\\[${value}\\]`;
      };
      const save = () => { try { localStorage.setItem('mathe-schreck', JSON.stringify({c:code.value,t:title.value,p:pure.checked,s:size.value})); } catch (_) {} };
      const setStatus = (message, kind='') => { status.textContent = message; status.className = kind; };

      async function render() {
        const raw = clean(code.value);
        sheetTitle.textContent = title.value.trim();
        sheetTitle.style.display = sheetTitle.textContent ? 'block' : 'none';
        preview.style.fontSize = `${size.value}rem`;
        preview.style.whiteSpace = pure.checked ? 'normal' : 'pre-wrap';
        preview.textContent = raw ? math(raw, pure.checked) : '';
        setStatus(''); save();
        if (!raw || !window.MathJax?.typesetPromise) return;
        try {
          MathJax.typesetClear([preview]);
          await MathJax.typesetPromise([preview]);
          const error = preview.querySelector('mjx-merror');
          if (error) setStatus('LaTeX-Fehler: Syntax bitte prüfen.', 'error');
        } catch (error) { setStatus(`Rendern fehlgeschlagen: ${error.message}`, 'error'); }
      }

      let timer;
      const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 250); };
      [code,title].forEach(el => el.addEventListener('input', schedule));
      [pure,size].forEach(el => el.addEventListener('change', render));
      $('print').addEventListener('click', async () => { await render(); window.print(); });
      $('clear').addEventListener('click', () => { code.value=''; title.value=''; history.replaceState(null,'',location.pathname); render(); code.focus(); });
      $('copy').addEventListener('click', async () => {
        const params = new URLSearchParams({c:code.value,p:pure.checked?'1':'0'});
        history.replaceState(null,'',`${location.pathname}#${params}`);
        try { await navigator.clipboard.writeText(location.href); setStatus('Link kopiert. Der LaTeX-Code steckt in der URL.', 'warn'); }
        catch (_) { setStatus('Der Link steht in der Adresszeile und kann dort kopiert werden.', 'warn'); }
      });
      $('examples').addEventListener('change', event => { if (!event.target.value) return; code.value=examples[event.target.value]; pure.checked=event.target.value !== 'text'; event.target.value=''; render(); });
      document.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); render(); } });

      (() => {
        const hash = new URLSearchParams(location.hash.slice(1));
        if (hash.has('c')) { code.value=hash.get('c'); pure.checked=hash.get('p') !== '0'; }
        else { try { const data=JSON.parse(localStorage.getItem('mathe-schreck') || '{}'); code.value=data.c || ''; title.value=data.t || ''; if (typeof data.p === 'boolean') pure.checked=data.p; if (data.s) size.value=data.s; } catch (_) {} }
        render();
        const script=document.createElement('script'); script.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js'; script.async=true; script.onload=render; script.onerror=() => setStatus('MathJax konnte nicht geladen werden. Internetverbindung prüfen.', 'error'); document.head.appendChild(script);
      })();
    })();
  </script>
</body>
</html>
